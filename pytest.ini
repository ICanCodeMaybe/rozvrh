[pytest]
filterwarnings =
    error
    ; Third-party deprecations on Python 3.14 — not ours to fix.
    ; Scoped by message so new warnings from our own code still fail.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
